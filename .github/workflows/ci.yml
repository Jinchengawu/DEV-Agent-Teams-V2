name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Install locked development dependencies
        run: uv sync --extra dev --extra live --locked
      - name: Install locked console dependencies
        run: pnpm --dir console install --frozen-lockfile
      - name: Install locked four-repository verification tools
        run: pnpm --dir examples/health-contract-v1/frontend install --frozen-lockfile --ignore-scripts
      - name: Explicitly prepare isolated offline verification environment
        run: |
          uv run python scripts/prepare_verification_tools.py --source-node-modules examples/health-contract-v1/frontend/node_modules --target "$RUNNER_TEMP/agent-team-os-verification-tools"
          echo "AGENT_TEAM_OS_VERIFICATION_TOOLS_DIR=$RUNNER_TEMP/agent-team-os-verification-tools" >> "$GITHUB_ENV"
      - name: Install matching Chromium and operating system dependencies
        run: uv run python -m playwright install --with-deps chromium
      - name: Validate evaluation dataset
        run: uv run agent-team-os-dev eval validate-dataset
      - name: Validate migrations on a fresh database
        env:
          MIGRATION_CHECK_DB: ${{ runner.temp }}/migration-check.sqlite
        run: >-
          uv run python -c "import os; from pathlib import Path;
          from agent_team_os.infrastructure.database import MigrationRunner;
          MigrationRunner(Path(os.environ['MIGRATION_CHECK_DB']), Path('migrations')).migrate()"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q --junitxml="$RUNNER_TEMP/agent-team-os-pytest.xml"
      - name: Build Python package
        run: uv build
      - name: Verify generated OpenAPI contract
        run: >-
          uv run python scripts/export_openapi.py --output console/openapi.json
          && pnpm --dir console api:check
      - name: Type-check console
        run: pnpm --dir console typecheck
      - name: Test console
        run: pnpm --dir console test
      - name: Build console
        run: pnpm --dir console build
      - name: Audit CI static delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          junit="$RUNNER_TEMP/agent-team-os-pytest.xml"
          bundle_parent="$RUNNER_TEMP/agent-team-os-ci-bundle"
          receipt="$RUNNER_TEMP/agent-team-os-b0-audit-receipt.json"
          [[ -f "$junit" && ! -L "$junit" ]]
          [[ ! -e "$bundle_parent" && ! -L "$bundle_parent" ]]
          [[ ! -e "$receipt" && ! -L "$receipt" ]]
          shopt -s nullglob
          wheels=(dist/dev_agent_teams_v2-*.whl)
          sdists=(dist/dev_agent_teams_v2-*.tar.gz)
          [[ ${#wheels[@]} -eq 1 && ${#sdists[@]} -eq 1 ]]
          [[ -f "${wheels[0]}" && ! -L "${wheels[0]}" ]]
          [[ -f "${sdists[0]}" && ! -L "${sdists[0]}" ]]
          revision="$(git rev-parse --verify HEAD)"
          if ! uv run --no-sync python scripts/build_delivery_bundle.py \
            --project-root "$PWD" \
            --output-root "$bundle_parent" \
            --wheel "${wheels[0]}" \
            --git-revision "$revision" >/dev/null 2>&1; then
            printf '%s\n' 'b0_builder=failed'
            exit 1
          fi
          bundles=("$bundle_parent"/agent-team-os-*)
          [[ ${#bundles[@]} -eq 1 && -d "${bundles[0]}" && ! -L "${bundles[0]}" ]]
          if ! uv run --no-sync python scripts/audit_ci_bundle_artifact.py "${bundles[0]}" \
            --project-root "$PWD" \
            --pytest-junit "$RUNNER_TEMP/agent-team-os-pytest.xml" \
            --receipt "$receipt" \
            --expected-revision "$revision" 2>/dev/null; then
            printf '%s\n' 'b0_audit=failed'
            exit 1
          fi
