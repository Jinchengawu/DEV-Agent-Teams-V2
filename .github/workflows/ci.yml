name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --extra dev --locked
      - name: Validate evaluation dataset
        run: uv run agent-team-os-dev eval validate-dataset
      - name: Validate migrations on a fresh database
        env:
          MIGRATION_CHECK_DB: ${{ runner.temp }}/migration-check.sqlite
        run: >-
          uv run python -c "import os; from pathlib import Path;
          from agent_team_os.infrastructure.database import MigrationRunner;
          MigrationRunner(Path(os.environ['MIGRATION_CHECK_DB']), Path('migrations')).migrate()"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Build
        run: uv build
