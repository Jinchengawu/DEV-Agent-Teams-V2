schema_version: "3"

capabilities:
  - id: hermes-pm
    version: "1.0.0"
    labels: [planner, product]
    adapter:
      type: hermes.acp

  - id: hermes-project-admin
    version: "1.0.0"
    labels: [planner, tasking]
    adapter:
      type: hermes.acp

  - id: codex-backend
    version: "1.0.0"
    labels: [developer, backend]
    adapter:
      type: codex.cli
      config:
        sandbox: workspace-write
        timeout_seconds: 180

  - id: design.system
    version: "1.0.0"
    labels: [designer, ui, specification]
    adapter:
      type: codex.cli
      config:
        sandbox: workspace-write
        timeout_seconds: 180

  - id: frontend.implementation
    version: "1.0.0"
    labels: [developer, frontend]
    adapter:
      type: codex.cli
      config:
        sandbox: workspace-write
        timeout_seconds: 180

  - id: testing.review
    version: "1.0.0"
    labels: [qa, testing]
    adapter:
      type: codex.cli
      config:
        sandbox: workspace-write
        timeout_seconds: 180

  - id: workcell.lead
    version: "1.0.0"
    labels: [workcell, lead, synthesis]
    adapter:
      type: codex.cli
      config:
        sandbox: read-only
        timeout_seconds: 300

  - id: workcell.delegate
    version: "1.0.0"
    labels: [workcell, delegate, method-pack]
    adapter:
      type: codex.cli
      config:
        sandbox: workspace-write
        timeout_seconds: 300
